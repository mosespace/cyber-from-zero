name: Feature request
description: Suggest an improvement to the website or learning experience
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Great ideas often come from learners. Tell us what would make learning here easier or more fun.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation from a learner's point of view.
      placeholder: "As a beginner I find it hard to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: A sketch, a link to an example, or a short description all work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Learning experience
        - Gamification (XP, streaks, badges)
        - Audio
        - Design
        - Accessibility
        - Performance
        - Developer experience
        - Translation
        - Something else
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I would like to work on it"
        - "Maybe, with some guidance"
        - "No, I am only suggesting it"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find this idea.
          required: true
        - label: This keeps the project free, simple and account-free (no tracking).
          required: false
